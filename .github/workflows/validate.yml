name: Validate mod
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Syntax, offline regressions, assets, and packaging
        run: python scripts/test.py
      - name: Download official Factorio headless with Space Age
        run: |
          curl --fail --location --retry 3 https://factorio.com/get-download/2.0.77/headless/linux64 -o "$RUNNER_TEMP/factorio.tar.xz"
          echo "c4efc11529f74d37c96933e291e0db73fd9f5aa4738913d9301b24680b3e947f  $RUNNER_TEMP/factorio.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/factorio.tar.xz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/factorio/bin/x64/factorio" --version
      - name: Real data-stage and runtime regressions
        run: python scripts/smoke_test.py "$RUNNER_TEMP/factorio/bin/x64/factorio"
      - name: Build release ZIP
        run: python scripts/build.py
      - name: Upload validation evidence and tested package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-fleets-validation
          path: |
            validation/*.log
            dist/interstellar-fleets_0.2.2.zip
          if-no-files-found: warn
